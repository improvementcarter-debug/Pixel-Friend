
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel-Friend - Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #070b12;
            color: #fff;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        /* Sidebar */
        .sidebar {
            width: 200px;
            background-color: #0d1322;
            border-right: 2px solid #1a253a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 10px;
        }
        .logo {
            font-size: 14px;
            font-weight: bold;
            color: #00ff66;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .user-profile-box {
            background: #111a2e;
            padding: 10px;
            border: 1px solid #1f2e4d;
            text-align: center;
            margin-bottom: 20px;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            background: #2a3b5c;
            border-radius: 50%;
            margin: 0 auto 8px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }
        .nav-links li a {
            color: #8b9bb4;
            text-decoration: none;
            display: block;
            padding: 8px 10px;
            font-size: 12px;
            transition: 0.2s;
        }
        .nav-links li.active a, .nav-links li a:hover {
            background: #1a253a;
            color: #00ff66;
            border-left: 3px solid #00ff66;
        }
        .logout-btn {
            color: #ff4444;
            text-decoration: none;
            font-size: 12px;
            padding: 8px;
            display: block;
            border: 1px solid #3a1a1a;
            text-align: center;
            background: #1a0f0f;
        }

        /* Main Chat Area */
        .main-container {
            flex-grow: 1;
            display: flex;
            background-color: #0b101b;
        }
        .chats-sidebar {
            width: 240px;
            border-right: 1px solid #1a253a;
            padding: 15px;
        }
        .chats-title {
            font-size: 11px;
            color: #5d6f8c;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background: #141c2e;
            border: 1px solid #223254;
            cursor: pointer;
        }

        /* Chat Window */
        .chat-window {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a253a;
            padding-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .status-badge {
            color: #00ff66;
            font-size: 11px;
        }
        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message-bubble {
            background: #131c2e;
            border: 1px solid #1f2e4d;
            padding: 12px;
            max-width: 300px;
            font-size: 12px;
        }
        .message-status {
            font-size: 10px;
            text-align: right;
            margin-top: 4px;
        }

        /* Chat Input Box */
        .chat-input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #111827;
            padding: 10px;
            border: 1px solid #1f2e4d;
        }
        .action-btn {
            background: #19243d;
            border: 1px solid #2a3b5c;
            color: #fff;
            padding: 8px 12px;
            font-size: 10px;
            cursor: pointer;
        }
        .action-btn:hover {
            background: #223254;
        }
        .chat-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            font-size: 12px;
        }
        .send-btn {
            background: #0066ff;
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }
        .send-btn:hover {
            background: #0052cc;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div>
            <div class="logo">Pixel-Friend</div>
            <div class="user-profile-box">
                <div class="user-avatar">🐸</div>
                <div style="font-size: 11px; font-weight: bold;">PIXEL</div>
                <div style="font-size: 9px; color: #8b9bb4; margin-top: 2px;">LEVEL 1</div>
            </div>
            <ul class="nav-links">
                <li><a href="#">HOME</a></li>
                <li><a href="#">FRIENDS</a></li>
                <li class="active"><a href="#">MESSAGES</a></li>
                <li><a href="#">RANK</a></li>
                <li><a href="#">PROFILE</a></li>
            </ul>
        </div>
        <a href="#" class="logout-btn">LOGOUT</a>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Chats Sidebar List -->
        <div class="chats-sidebar">
            <div class="chats-title">CHATS</div>
            <div class="chat-item">
                <div style="width: 24px; height: 24px; background: #2a3b5c; border-radius: 50%; text-align: center; line-height: 24px; font-size: 10px;">C</div>
                <span style="font-size: 12px;">CARTER</span>
            </div>
        </div>

        <!-- Active Chat Window -->
        <div class="chat-window">
            <div class="chat-header">
                <span>CARTER</span>
                <span class="status-badge">STATUS: ONLINE</span>
            </div>

            <!-- Messages List -->
            <div class="chat-messages" id="message-container">
                <div class="message-bubble" data-id="1">
                    <div style="margin-bottom: 8px; font-size: 10px; color: #8b9bb4;">Replying to You [Media/Sticker]</div>
                    <div>nice</div>
                    <div class="message-status read" style="color: #00ff66;">✓✓ Read</div>
                </div>
            </div>

            <!-- Input Bar -->
            <div class="chat-input-area">
                <button class="action-btn" id="voice-btn">VOICE</button>
                <button class="action-btn">📁</button>
                <button class="action-btn">⭐</button>
                <input type="text" class="chat-input" id="message-input" placeholder="Type a message...">
                <button class="send-btn" id="send-btn">SEND</button>
            </div>
        </div>
    </div>

    <!-- Script Integration (Voice Recorder & Read Status) -->
    <script>
        // --- 1. VOICE RECORDER MODULE ---
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        const voiceButton = document.querySelector('#voice-btn');

        if (voiceButton) {
            voiceButton.addEventListener('click', async () => {
                if (!isRecording) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        mediaRecorder = new MediaRecorder(stream);
                        audioChunks = [];

                        mediaRecorder.ondataavailable = (event) => {
                            if (event.data.size > 0) {
                                audioChunks.push(event.data);
                            }
                        };

                        mediaRecorder.onstop = async () => {
                            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                            await sendVoiceMessageToServer(audioBlob);
                        };

                        mediaRecorder.start();
                        isRecording = true;
                        voiceButton.textContent = "STOP";
                        voiceButton.style.color = "#ff4444";
                    } catch (err) {
                        console.error("Microphone access error:", err);
                        alert("Microphone permission is required to send voice messages.");
                    }
                } else {
                    mediaRecorder.stop();
                    isRecording = false;
                    voiceButton.textContent = "VOICE";
                    voiceButton.style.color = "";
                }
            });
        }

        async function sendVoiceMessageToServer(blob) {
            const formData = new FormData();
            formData.append("audio", blob, "voice_message.webm");
            formData.append("sender", "PIXEL");
            formData.append("recipient", "CARTER");

            try {
                const response = await fetch('/api/messages/voice', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                console.log("Voice message uploaded:", data);
            } catch (error) {
                console.error("Upload failed:", error);
            }
        }

        // --- 2. READ-STATUS TRACKER MODULE ---
        async function markChatAsRead(chatId) {
            try {
                await fetch(`/api/chats/${chatId}/read`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user: 'PIXEL' })
                });
                updateLocalReadIndicators();
            } catch (error) {
                console.error("Failed to mark chat as read:", error);
            }
        }

        function updateLocalReadIndicators() {
            const unreadIndicators = document.querySelectorAll('.message-status.unread');
            unreadIndicators.forEach(el => {
                el.textContent = '✓✓ Read';
                el.style.color = '#00ff66';
                el.classList.remove('unread');
                el.classList.add('read');
            });
        }

        // Handle sending regular text messages via button click
        const sendBtn = document.getElementById('send-btn');
        const messageInput = document.getElementById('message-input');
        const messageContainer = document.getElementById('message-container');

        sendBtn.addEventListener('click', () => {
            const text = messageInput.value.trim();
            if(!text) return;

            const newMsg = document.createElement('div');
            newMsg.className = 'message-bubble';
            newMsg.innerHTML = `
                <div>${text}</div>
                <div class="message-status unread" style="color: #888888;">✓ Sent</div>
            `;
            messageContainer.appendChild(newMsg);
            messageInput.value = '';
            messageContainer.scrollTop = messageContainer.scrollHeight;
        });
    </script>
</body>
</html>
