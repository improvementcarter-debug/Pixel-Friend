<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        /* Dark Theme Styles */
        body { background: #0a0e14; color: #fff; font-family: monospace; }
        .chat-container { border: 1px solid #333; padding: 20px; width: 600px; }
        
        /* Reply Banner */
        #reply-banner { 
            background: #1a222d; 
            padding: 10px; 
            margin-bottom: 10px; 
            display: none; /* Hidden by default */
            border-left: 3px solid #00ffcc;
        }
        
        /* Input Area */
        .input-area { margin-top: 20px; }
        input { background: #050505; color: white; padding: 10px; width: 400px; border: 1px solid #444; }
        button { background: #3498db; color: white; border: none; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Replying UI -->
    <div id="reply-banner">
        <span id="reply-label">Replying to: "..."</span>
        <button onclick="cancelReply()">X CANCEL</button>
    </div>

    <!-- Message List (Example) -->
    <div id="chat-messages">
        <p>Message 1 <button onclick="setReply('1')">Reply</button></p>
    </div>

    <!-- Controls -->
    <div class="input-area">
        <input type="text" id="message-input" placeholder="Type a message...">
        <button onclick="sendMessage()">SEND</button>
    </div>
</div>

<script>
    // 1. GLOBAL STATE: This variable tracks what you are replying to
    let activeReplyId = null;

    // 2. FUNCTION: Called when you click "Reply" on a message
    function setReply(messageId) {
        activeReplyId = messageId;
        document.getElementById('reply-label').innerText = `Replying to: "${messageId}"`;
        document.getElementById('reply-banner').style.display = 'block';
    }

    // 3. FUNCTION: Called when you click "Cancel"
    function cancelReply() {
        activeReplyId = null;
        document.getElementById('reply-banner').style.display = 'none';
    }

    // 4. FUNCTION: Called when you click "Send"
    function sendMessage() {
        const input = document.getElementById('message-input');
        
        // Construct the data payload
        const payload = {
            text: input.value,
            // CRITICAL FIX: Include the reply ID only if it exists
            reply_to: activeReplyId 
        };

        console.log("Sending Payload:", payload); // Debugging

        // Perform your fetch/API call here
        /*
        fetch('/your-api-endpoint', {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        */

        // Reset UI after sending
        input.value = '';
        cancelReply(); 
    }
</script>

</body>
</html>
